[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-claude-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.82",
    "click>=8.4.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
]

[project.scripts]
langgraph-claude-agents = "langgraph_claude_agents.cli:cli"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.26",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: mark test as an integration test — covers tests that require a live LLM API and tests that exercise the full node→run_agent→query integration path with query patched",
]
